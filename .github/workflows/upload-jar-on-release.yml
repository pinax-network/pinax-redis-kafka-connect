name: Upload JAR on Release

on:
  release:
    types: [created]

env:
  PINAX_CONNECT_REPO: pinax-network/pinax-connect

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Build the project
        run: mvn clean package

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: target/pinax-redis-kafka-connect.jar
          asset_name: pinax-redis-kafka-connect.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Dispatch build event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PINAX_CONNECT_TOKEN }}
          repository: ${{ env.PINAX_CONNECT_REPO }}
          event-type: build-push-image
          client-payload: '{"ref": "${{ github.ref }}"}'